name: pocketledger
description: An offline personal ledger for Android and iOS.
publish_to: none
version: 1.5.2+8

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.11.1
  sqflite: ^2.4.6
  intl: ^0.20.3
  uuid: ^4.6.0
  cryptography: ^2.9.0
  file_picker: ^13.4.0
  excel: ^4.0.6
  pdf: ^3.12.0
  share_plus: ^13.3.1
  image_picker: ^1.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.7

flutter:
  uses-material-design: true
  assets:
    - assets/branding/pocketledger.png
    - assets/fonts/NotoSans-Regular.ttf
    - assets/fonts/NotoSansDevanagari-Regular.ttf
    - assets/fonts/LICENSE
